apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: application-observer, namespace: dev}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
