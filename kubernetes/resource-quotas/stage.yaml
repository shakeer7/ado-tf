apiVersion: v1
kind: ResourceQuota
metadata: {name: lab-quota, namespace: stage}
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "8"
    services: "4"
    services.loadbalancers: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata: {name: lab-limits, namespace: stage}
spec:
  limits:
    - type: Container
      default: {cpu: 250m, memory: 128Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
