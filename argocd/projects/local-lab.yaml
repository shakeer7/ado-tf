{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "AppProject",
  "metadata": {
    "name": "platform-lab",
    "namespace": "argocd"
  },
  "spec": {
    "sourceRepos": [
      "git://host.docker.internal:9418/gitops.git"
    ],
    "destinations": [
      {
        "server": "https://kubernetes.default.svc",
        "namespace": "dev"
      },
      {
        "server": "https://kubernetes.default.svc",
        "namespace": "stage"
      }
    ],
    "clusterResourceWhitelist": [],
    "namespaceResourceWhitelist": [
      {
        "group": "",
        "kind": "Service"
      },
      {
        "group": "",
        "kind": "ServiceAccount"
      },
      {
        "group": "",
        "kind": "ConfigMap"
      },
      {
        "group": "apps",
        "kind": "Deployment"
      },
      {
        "group": "networking.k8s.io",
        "kind": "NetworkPolicy"
      },
      {
        "group": "policy",
        "kind": "PodDisruptionBudget"
      },
      {
        "group": "autoscaling",
        "kind": "HorizontalPodAutoscaler"
      },
      {
        "group": "secrets-store.csi.x-k8s.io",
        "kind": "SecretProviderClass"
      }
    ]
  }
}
