{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "sample-dev",
    "namespace": "argocd"
  },
  "spec": {
    "project": "platform-lab",
    "source": {
      "repoURL": "git://host.docker.internal:9418/gitops.git",
      "targetRevision": "main",
      "path": "helm/sample-application",
      "helm": {
        "releaseName": "sample-application",
        "valueFiles": [
          "values.yaml",
          "values-dev.yaml"
        ]
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "dev"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true
      },
      "retry": {
        "limit": 3
      }
    }
  }
}
