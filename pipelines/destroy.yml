trigger: none
pr: none
parameters:
  - name: target
    type: string
    default: shared-aks
    values: [shared-aks]
  - name: confirmation
    type: string
    default: 'NO'
  - name: pool
    type: object
    default: {vmImage: ubuntu-24.04}
pool: ${{ parameters.pool }}
variables:
  - template: templates/azure-env.yml
lockBehavior: sequential
stages:
  - stage: DestroyPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - job: InventoryAndPlan
        steps:
          - checkout: self
            persistCredentials: false
          - bash: |
              set -euo pipefail
              test "$CONFIRMATION" = 'DESTROY shared-aks'
            env: {CONFIRMATION: '${{ parameters.confirmation }}'}
            displayName: Require explicit target confirmation
          - template: templates/tools.yml
          - task: AzureCLI@2
            inputs:
              azureSubscription: platform-plan
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                source scripts/oidc-env.sh
                bash scripts/terraform-plan.sh "$(Build.ArtifactStagingDirectory)/destroy-plan" --destroy
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              SERVICE_CONNECTION_ID: $(PlanServiceConnectionId)
              STATE_RESOURCE_GROUP: $(StateResourceGroup)
              STATE_ACCOUNT: $(StateAccount)
              STATE_CONTAINER: $(STATE_CONTAINER)
              STATE_KEY: $(STATE_KEY)
              TF_VAR_tenant_id: $(TenantId)
              TF_VAR_resource_group_name: $(PlatformResourceGroup)
              TF_VAR_unique_suffix: $(UniqueSuffix)
              TF_VAR_kubernetes_version: $(AksVersion)
              TF_VAR_authorized_ip_ranges: $(ApiCidrsJson)
              TF_VAR_admin_group_object_ids: $(AdminGroupsJson)
              TF_VAR_budget_emails: $(BudgetEmailsJson)
              TF_VAR_budget_start_date: $(BudgetStartDate)
          - publish: $(Build.ArtifactStagingDirectory)/destroy-plan
            artifact: destroy-plan
  - stage: Destroy
    dependsOn: DestroyPlan
    jobs:
      - deployment: DestroyApprovedPlan
        environment: azure-lab-destroy
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: false
                - download: current
                  artifact: destroy-plan
                - template: templates/tools.yml
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: platform-destroy
                    addSpnToEnvironment: true
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      source scripts/oidc-env.sh
                      python scripts/plan_artifact.py verify "$(Pipeline.Workspace)/destroy-plan" --destroy --same-run
                      bash scripts/terraform-apply.sh "$(Pipeline.Workspace)/destroy-plan" --destroy
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
                    SERVICE_CONNECTION_ID: $(DestroyServiceConnectionId)
                    TRUSTED_PIPELINE_ID: $(System.DefinitionId)
                    TRUSTED_RUN_ID: $(Build.BuildId)
                    STATE_RESOURCE_GROUP: $(StateResourceGroup)
                    STATE_ACCOUNT: $(StateAccount)
                    STATE_CONTAINER: $(STATE_CONTAINER)
                    STATE_KEY: $(STATE_KEY)
                - publish: reports
                  artifact: cleanup-report
