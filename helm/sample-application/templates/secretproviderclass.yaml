{{- if .Values.workloadIdentity.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: sample-application, namespace: {{ .Release.Namespace }}}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ .Values.workloadIdentity.vaultName | quote }}
    tenantId: {{ .Values.workloadIdentity.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.workloadIdentity.secretName }}
          objectType: secret
          objectAlias: platform-test-secret
{{- end }}
